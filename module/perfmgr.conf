# ---------------------------------------------------------------------------
# libperfmgr-hyperos - configuracao
# (a copia persistente vive em /data/adb/libperfmgr/perfmgr.conf)
#
# ENABLE_HAL    1 = arranca o servico android.hardware.power-service.pixel-libperfmgr
#               0 = apenas instala as bibliotecas (modo seguro)
# ENABLE_HINTS  1 = permite escrita nos nos sysfs do powerhint.json
#                   (e o que faz os "boosts" de CPU/GPU/stune acontecerem)
#               0 = apenas ADPF / hint sessions (sem tocar em sysfs) - predefinido
# START_METHOD auto = init (KernelSU initrc) se disponivel, senao arranque direto
#              rc     = apenas via init
#              script = apenas arranque direto pelo service.sh
# OVERRIDE_STOCK 1 = pede a substituicao do HAL android.hardware.power de fabrica
#                    (Qualcomm/CAF costuma ter um: vendor/bin/hw/android.hardware.power-service)
#                0 = nao mexe no HAL de fabrica: apenas instala as bibliotecas
# ALLOW_STOCK_OVERRIDE 1 = segunda confirmacao, definida por "action.sh override on".
#                    As configuracoes antigas sem esta chave nunca substituem o HAL.
# ---------------------------------------------------------------------------
# Perfil seguro: em aparelhos HyperOS com HAL de energia próprio, só ative a
# substituição depois de confirmar que o sistema continua estável.
ENABLE_HAL=0
ENABLE_HINTS=0
START_METHOD=auto
OVERRIDE_STOCK=0
ALLOW_STOCK_OVERRIDE=0
# FORCE_VARIANT auto = detecta CPU e lib AIDL automaticamente
#               api34 = forca Pixel 5 Snapdragon (ARMv8.0 compativel)
#               api35 = forca Pixel Tensor A15 (power AIDL V5)
#               api36 = forca Pixel Tensor A16+ (power AIDL V6)
FORCE_VARIANT=auto
